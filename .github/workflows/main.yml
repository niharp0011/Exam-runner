name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Files
        run: |
          sudo rsync -av --delete \
          --exclude=".git" \
          --exclude=".github" \
          ./ /var/www/html/

      - name: Restart Nginx
        run: |
          sudo systemctl restart nginx
